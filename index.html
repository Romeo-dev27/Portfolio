<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Révision Proba-Stat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>
  <style>
    :root {
      --bg-light: #f9f9f9;
      --bg-dark: #1e1e1e;
      --text-light: #333;
      --text-dark: #eee;
      --primary: #4a90e2;
      --card-bg-light: #fff;
      --card-bg-dark: #2a2a2a;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--primary);
      color: white;
    }
    header input {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      width: 50%;
    }
    .tabs {
      display: flex;
      justify-content: center;
      background: #ddd;
    }
    .tabs button {
      flex: 1;
      padding: 1rem;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-weight: bold;
    }
    .tabs button.active {
      background: var(--primary);
      color: white;
    }
    .container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .formula-card {
      background: var(--card-bg-light);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }
    body.dark .formula-card {
      background: var(--card-bg-dark);
    }
    .formula-card h3 {
      margin-top: 0;
    }
    .latex {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }
    .conditions {
      font-size: 0.9rem;
      color: gray;
    }
    .copy-btn {
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .mode-toggle {
      padding: 0.4rem 0.8rem;
      border: none;
      background: white;
      color: var(--primary);
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <input type="text" id="search" placeholder="Rechercher une formule...">
    <button class="mode-toggle" onclick="toggleMode()">🌙/☀️</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="container" id="content"></div>

  <script>
    const dataset = {
      "chapters": [
        /* === Ton JSON complet est injecté ici === */
        {
          "id": 1,
          "title": "Analyse Combinatoire & Probabilités",
          "formulas": [
            { "name": "Principe Fondamental de l'Analyse Combinatoire (PFAC)", "latex": "$$N = n_1 \\\\times n_2 \\\\times \\\\dots \\\\times n_k$$", "conditions": "$k$ expériences successives ou simultanées" },
            { "name": "Permutation sans répétition", "latex": "$$P_n = n!$$", "conditions": "Classement ordonné de $n$ objets distincts" },
            /* ... toutes les autres formules du chapitre 1 ... */
          ]
        },
        {
          "id": 2,
          "title": "Statistique Descriptive Simple (Univariée)",
          "formulas": [
            { "name": "Fréquence", "latex": "$$f_i = \\\\frac{n_i}{n}$$", "conditions": "$n_i$ : effectif, $n = \\\\sum n_i$" },
            /* ... toutes les autres formules du chapitre 2 ... */
          ]
        },
        {
          "id": 3,
          "title": "Statistique Descriptive Double (Bidimensionnelle)",
          "formulas": [
            { "name": "Fréquence conjointe", "latex": "$$f_{ij} = \\\\frac{n_{ij}}{n}$$", "conditions": "$n_{ij}$ : effectif conjoint" },
            /* ... toutes les autres formules du chapitre 3 ... */
          ]
        }
      ]
    };

    const tabs = document.getElementById('tabs');
    const content = document.getElementById('content');
    let currentChapter = dataset.chapters[0].id;

    function renderTabs() {
      tabs.innerHTML = '';
      dataset.chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch.title;
        btn.classList.toggle('active', ch.id === currentChapter);
        btn.onclick = () => {
          currentChapter = ch.id;
          renderContent();
          renderTabs();
        };
        tabs.appendChild(btn);
      });
    }

    function renderContent() {
      content.innerHTML = '';
      const chapter = dataset.chapters.find(c => c.id === currentChapter);
      chapter.formulas.forEach(f => {
        const card = document.createElement('div');
        card.className = 'formula-card';
        card.innerHTML = `
          <h3>${f.name}</h3>
          <div class="latex">${f.latex}</div>
          <p class="conditions">${f.conditions}</p>
          <button class="copy-btn">Copier LaTeX</button>
        `;
        card.querySelector('.copy-btn').onclick = () => {
          navigator.clipboard.writeText(f.latex);
          alert('LaTeX copié !');
        };
        content.appendChild(card);
      });
      renderMathInElement(content);
    }

    function toggleMode() {
      document.body.classList.toggle('dark');
    }

    document.getElementById('search').addEventListener('input', e => {
      const query = e.target.value.toLowerCase();
      const cards = content.querySelectorAll('.formula-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? '' : 'none';
      });
    });

    renderTabs();
    renderContent();
  </script>
</body>
</html>
