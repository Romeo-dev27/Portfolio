<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📐 Aide-Mémoire — Formules de Statistiques & Probabilités</title>

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <!-- KaTeX JS + Auto-Render (defer = chargé après le parsing HTML) -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header id="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📐</span>
        <div>
          <h1>Formules Exam</h1>
          <p class="subtitle">Probabilités & Statistiques</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Basculer le thème">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ========== SEARCH ========== -->
  <section class="search-section">
    <div class="search-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Rechercher une formule, un concept, une variable…" autocomplete="off" />
      <button id="clear-search" class="clear-btn hidden" aria-label="Effacer">✕</button>
      <span id="search-count" class="search-count"></span>
    </div>
  </section>

  <!-- ========== TABS ========== -->
  <nav class="tabs-nav" id="tabs-nav"></nav>

  <!-- ========== CONTENT ========== -->
  <main id="content-area"></main>

  <!-- ========== TOAST ========== -->
  <div id="toast" class="toast hidden">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span>LaTeX copié dans le presse-papier !</span>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer>
    <p>💡 <strong>Astuce :</strong> <kbd>Ctrl+K</kbd> pour rechercher • <kbd>Échap</kbd> pour effacer</p>
    <p class="footer-credit">Révision assistée — Bonne chance pour ton examen 🍀</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
