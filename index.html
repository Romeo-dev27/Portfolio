<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <div class="logo">
                <h1>Study Dashboard</h1>
            </div>
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle Dark Mode">
                <span class="icon">🌙</span>
            </button>
        </header>

        <main class="dashboard-grid">
            
            <section class="card stats-card full-width">
                <h2>Your Progress Overview</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="stat-tasks">0</span>
                        <span class="stat-label">Tasks Completed</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-sessions">0</span>
                        <span class="stat-label">Focus Sessions</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-habits">0</span>
                        <span class="stat-label">Active Habits</span>
                    </div>
                </div>
            </section>

            <section class="card pomodoro-card">
                <h2>Pomodoro Timer</h2>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="start-timer" class="btn primary">Start</button>
                    <button id="pause-timer" class="btn secondary">Pause</button>
                    <button id="reset-timer" class="btn outline">Reset</button>
                </div>
            </section>

            <section class="card todo-card">
                <h2>To-Do List</h2>
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="What needs to be done?">
                    <button id="add-todo" class="btn primary">+</button>
                </div>
                <ul id="todo-list" class="item-list">
                    </ul>
            </section>

            <section class="card habit-card">
                <h2>Habit Tracker</h2>
                <div class="input-group">
                    <input type="text" id="habit-input" placeholder="New daily habit...">
                    <button id="add-habit" class="btn primary">+</button>
                </div>
                <ul id="habit-list" class="item-list">
                    </ul>
            </section>

            <section class="card goals-card">
                <h2>Long-Term Goals</h2>
                <div class="input-group">
                    <input type="text" id="goal-input" placeholder="Enter a new goal...">
                    <button id="add-goal" class="btn primary">+</button>
                </div>
                <ul id="goal-list" class="item-list">
                    </ul>
            </section>

        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
